<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="副业记账">
  <meta name="theme-color" content="#0f0f1a">
  <title>副业记账</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ====== 记账页 ====== -->
  <div id="page-track" class="page active">

    <div class="card summary">
      <div class="summary-label">今日收入</div>
      <div class="summary-amount" id="todayTotal">¥0.00</div>
      <div class="summary-count" id="todayCount">共 0 笔</div>
    </div>

    <div class="card input-area">
      <div class="amount-row">
        <span class="yuan">¥</span>
        <input type="text" id="amountInput" placeholder="0.00" inputmode="decimal" autocomplete="off">
      </div>
      <input type="text" id="noteInput" placeholder="备注（选填）" maxlength="50" autocomplete="off">
      <div id="noteTemplates" class="note-templates"></div>
      <button id="addBtn">记一笔</button>
      <div class="chips" id="chips"></div>
    </div>

    <div class="history-bar">
      <button id="prevDay">‹</button>
      <span id="dateLabel">今天</span>
      <button id="nextDay">›</button>
    </div>
    <div id="entryList" class="entry-list-scroll"></div>
  </div>

  <!-- ====== 统计页 ====== -->
  <div id="page-stats" class="page">
    <!-- 分类筛选 -->
    <div class="category-filter" id="categoryFilter">
      <button class="cat-btn active" data-cat="all">全部</button>
      <button class="cat-btn" data-cat="GPT">GPT</button>
      <button class="cat-btn" data-cat="抢车">抢车</button>
      <button class="cat-btn" data-cat="基金">基金</button>
      <button class="cat-btn" data-cat="闲置">闲置</button>
    </div>

    <!-- 时间范围 -->
    <div class="stats-tabs">
      <button class="stat-tab active" data-mode="week">本周</button>
      <button class="stat-tab" data-mode="month">本月</button>
      <button class="stat-tab" data-mode="year">全年</button>
    </div>

    <!-- 汇总数字 -->
    <div class="card stats-card">
      <div class="stats-summary-head" id="statsTitle">全部收入</div>
      <div class="stats-summary-row">
        <div><span class="stats-num" id="statsTotal">¥0</span><span class="stats-label">总收入</span></div>
        <div><span class="stats-num" id="statsAvg">¥0</span><span class="stats-label">日均</span></div>
        <div><span class="stats-num" id="statsMax">¥0</span><span class="stats-label">最高</span></div>
      </div>
      <div class="stats-extra" id="statsCount">共 0 笔</div>
    </div>

    <!-- 图表 -->
    <div class="card chart-card">
      <canvas id="chart" style="width:100%;height:100%"></canvas>
    </div>
  </div>

  <!-- ====== 底部导航 ====== -->
  <nav id="bottomNav">
    <button class="nav-btn active" data-page="page-track">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      <span>记账</span>
    </button>
    <button class="nav-btn" data-page="page-stats">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>统计</span>
    </button>
  </nav>

  <div id="toast"></div>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
  </script>
  <script src="app.js"></script>
</body>
</html>
