<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="副业记账">
  <meta name="theme-color" content="#0f0f1a">
  <title>副业记账</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ====== 记账页 ====== -->
  <div id="page-track" class="page active">

    <div class="card summary">
      <div class="summary-label" id="summaryLabel">今日收益</div>
      <div class="summary-amount" id="todayTotal">¥0.00</div>
      <div class="summary-count" id="todayCount">共 0 笔</div>
    </div>

    <div class="card input-area">
      <div class="amount-row">
        <button type="button" id="signToggle" class="sign-toggle" aria-label="切换正负金额" aria-pressed="false">±</button>
        <span class="yuan">¥</span>
        <input type="text" id="amountInput" placeholder="0.00" inputmode="decimal" autocomplete="off">
      </div>
      <div id="entryCategory" class="entry-category"></div>
      <input type="text" id="noteInput" placeholder="备注（选填）" maxlength="50" autocomplete="off">
      <div id="noteTemplates" class="note-templates"></div>
      <button id="addBtn">记一笔</button>
      <div class="chips" id="chips"></div>
    </div>

    <div class="history-bar">
      <button id="prevDay">‹</button>
      <span id="dateLabel">今天</span>
      <button id="nextDay" disabled style="opacity:0.3">›</button>
    </div>

    <div class="card entries-card">
      <div class="entries-head">
        <span>当日记录</span>
        <span id="entriesMeta">共 0 笔</span>
      </div>
      <div id="entryList" class="entry-list-scroll"></div>
    </div>

    <div class="card calendar-card">
      <div class="calendar-head">
        <button id="prevCalendarMonth" aria-label="上一月">‹</button>
        <span id="calendarLabel">本月</span>
        <button id="nextCalendarMonth" aria-label="下一月">›</button>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>
  </div>

  <!-- ====== 统计页 ====== -->
  <div id="page-stats" class="page">
    <!-- 分类筛选 -->
    <div class="category-filter" id="categoryFilter">
      <button class="cat-btn active" data-cat="all">全部</button>
      <button class="cat-btn" data-cat="GPT">GPT</button>
      <button class="cat-btn" data-cat="抢车">抢车</button>
      <button class="cat-btn" data-cat="基金">基金</button>
      <button class="cat-btn" data-cat="闲置">闲置</button>
      <button class="cat-btn" data-cat="未分类">未分类</button>
    </div>

    <!-- 时间范围 -->
    <div class="stats-tabs">
      <button class="stat-tab active" data-mode="week">本周</button>
      <button class="stat-tab" data-mode="month">本月</button>
      <button class="stat-tab" data-mode="year">全年</button>
    </div>

    <div class="stats-period">
      <button id="prevPeriod" aria-label="上一周期">‹</button>
      <span id="periodLabel">本周</span>
      <button id="nextPeriod" aria-label="下一周期" disabled>›</button>
    </div>

    <!-- 汇总数字 -->
    <div class="card stats-card">
      <div class="stats-summary-head" id="statsTitle">全部收益</div>
      <div class="stats-summary-row">
        <div><span class="stats-num neutral" id="statsTotal">¥0</span><span class="stats-label">净收益</span></div>
        <div><span class="stats-num" id="statsAvg">¥0</span><span class="stats-label">日均</span></div>
        <div><span class="stats-num" id="statsMax">¥0</span><span class="stats-label">最高</span></div>
      </div>
      <div class="stats-extra" id="statsCount">共 0 笔</div>
    </div>

    <!-- 图表 -->
    <div class="card chart-card">
      <canvas id="chart" style="width:100%;height:100%"></canvas>
    </div>

    <div class="card share-card">
      <div class="share-head">分类占比</div>
      <div id="categoryShareList" class="share-list"></div>
    </div>

    <div class="data-actions">
      <button id="exportBtn">导出数据</button>
      <button id="importBtn">导入数据</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <div id="editModal" class="modal hidden">
    <div class="modal-panel">
      <div class="modal-head">
        <span>编辑记录</span>
        <button id="editClose" aria-label="关闭">×</button>
      </div>
      <input type="date" id="editDate">
      <div id="editCategory" class="entry-category"></div>
      <input type="text" id="editAmount" placeholder="金额" inputmode="decimal" autocomplete="off">
      <input type="text" id="editNote" placeholder="备注（选填）" maxlength="50" autocomplete="off">
      <div class="modal-actions">
        <button id="editDelete" class="danger">删除</button>
        <button id="editCancel">取消</button>
        <button id="editSave" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ====== 底部导航 ====== -->
  <nav id="bottomNav">
    <button class="nav-btn active" data-page="page-track">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      <span>记账</span>
    </button>
    <button class="nav-btn" data-page="page-stats">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>统计</span>
    </button>
  </nav>

  <div id="toast"></div>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
  </script>
  <script src="app.js"></script>
</body>
</html>
